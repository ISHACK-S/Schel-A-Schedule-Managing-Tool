<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHEL | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="app-page">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand-wrap">
          <span class="brand-mark">S</span>
          <span class="brand-name">SCHEL</span>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html">Dashboard</a>
          <a class="nav-item" href="schedules.html">Schedules</a>
          <a class="nav-item" href="categories.html">Categories</a>
          <a class="nav-item" href="reminders.html">Reminders</a>
          <a class="nav-item active" href="profile.html">Profile</a>
          <button type="button" class="nav-item nav-button" data-action="logout">Logout</button>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Account</p>
            <h1>Profile</h1>
            <p class="page-subtitle">Your account details.</p>
          </div>
          <button class="btn btn-secondary" type="button" disabled aria-label="Profile editing is not supported by the current backend">Edit profile</button>
        </header>

        <section class="panel-card profile-card" aria-live="polite">
          <div id="profile-loading" class="profile-loading">
            <div class="load-skeleton" style="width: 68px; height: 68px; border-radius: 18px; margin-bottom: 18px;"></div>
            <div class="load-skeleton" style="width: 180px; height: 24px; margin-bottom: 10px;"></div>
            <div class="load-skeleton" style="width: 120px; height: 14px;"></div>
          </div>

          <div id="profile-content" hidden>
            <div class="profile-header">
              <div id="profile-avatar" class="avatar">U</div>
              <div>
                <h2 id="profile-name">User</h2>
                <p class="profile-subtitle">Account overview</p>
              </div>
            </div>

            <div class="profile-grid">
              <div class="field-group">
                <label for="profile-username">Username</label>
                <input id="profile-username" type="text" readonly aria-label="Username" />
              </div>
              <div class="field-group">
                <label for="profile-email">Email</label>
                <input id="profile-email" type="email" readonly aria-label="Email" />
              </div>
              <div class="field-group form-span-2">
                <label for="profile-created-at">Member since</label>
                <input id="profile-created-at" type="text" readonly aria-label="Member since" />
              </div>
            </div>

            <div class="profile-note">
              <p>Profile editing is currently unavailable because the existing backend does not expose update-user endpoints.</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
