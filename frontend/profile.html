<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHEL | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="app-page">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand-wrap">
          <span class="brand-mark">S</span>
          <span class="brand-name">SCHEL</span>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html">Dashboard</a>
          <a class="nav-item" href="schedules.html">Schedules</a>
          <a class="nav-item" href="categories.html">Categories</a>
          <a class="nav-item" href="reminders.html">Reminders</a>
          <a class="nav-item active" href="profile.html">Profile</a>
          <button type="button" class="nav-item nav-button" data-action="logout">Logout</button>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Account</p>
            <h1>Profile</h1>
          </div>
          <button class="btn btn-primary" type="button">Edit profile</button>
        </header>

        <section class="panel-card profile-card">
          <div class="profile-header">
            <div class="avatar">A</div>
            <div>
              <h2>Alex Morgan</h2>
              <p>Product planner</p>
            </div>
          </div>

          <div class="profile-grid">
            <div class="field-group">
              <label>Username</label>
              <input type="text" value="alexmorgan" aria-label="Username" />
            </div>
            <div class="field-group">
              <label>Email</label>
              <input type="email" value="alex@schel.io" aria-label="Email" />
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
