<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHEL | Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="app-page">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand-wrap">
          <span class="brand-mark">S</span>
          <span class="brand-name">SCHEL</span>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html">Dashboard</a>
          <a class="nav-item" href="schedules.html">Schedules</a>
          <a class="nav-item active" href="categories.html">Categories</a>
          <a class="nav-item" href="reminders.html">Reminders</a>
          <a class="nav-item" href="profile.html">Profile</a>
          <button type="button" class="nav-item nav-button" data-action="logout">Logout</button>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Organization</p>
            <h1>Categories</h1>
            <p class="page-subtitle">Organize your schedules with a system that works for you.</p>
          </div>
          <button id="open-create-modal" class="btn btn-primary" type="button">+ Add Category</button>
        </header>

        <section class="panel-card schedule-toolbar" aria-label="Category search">
          <div class="toolbar-grid single-search-grid">
            <div class="field-group search-field">
              <label for="category-search">Search</label>
              <input id="category-search" type="search" placeholder="Search categories..." />
            </div>
          </div>
        </section>

        <section class="panel-card schedule-panel" aria-live="polite">
          <div class="panel-header schedule-header-row">
            <h2>Your categories</h2>
            <span id="category-count-badge" class="badge badge-neutral">0 categories</span>
          </div>
          <div id="category-list" class="category-grid"></div>
        </section>
      </main>
    </div>

    <div id="category-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Category</p>
            <h2 id="category-modal-title">Create Category</h2>
          </div>
          <button class="icon-button" type="button" data-close-modal="true" aria-label="Close">✕</button>
        </div>

        <form id="category-form" novalidate>
          <div class="form-grid">
            <div class="field-group form-span-2">
              <label for="category-name">Category Name</label>
              <input id="category-name" name="name" type="text" maxlength="100" placeholder="e.g. Work, Personal, Learning" />
              <small class="field-error" data-error-for="name"></small>
            </div>

            <div class="field-group form-span-2">
              <label for="category-color">Category Color</label>
              <input id="category-color" name="color" type="color" value="#5b6cff" />
              <small class="field-error" data-error-for="color"></small>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="true">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-category-btn">Create Category</button>
          </div>
        </form>
      </div>
    </div>

    <div id="delete-category-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-panel confirm-panel" role="dialog" aria-modal="true" aria-labelledby="delete-category-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Delete</p>
            <h2 id="delete-category-title">Delete category?</h2>
          </div>
          <button class="icon-button" type="button" data-close-modal="true" aria-label="Close">✕</button>
        </div>

        <p id="delete-category-message" class="confirm-copy"></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close-modal="true">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-delete-category-btn">Delete</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/config.js?v=phase-f"></script>
    <script src="js/api.js?v=phase-f"></script>
    <script src="js/categories.js"></script>
  </body>
</html>
