<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHEL | Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="app-page">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand-wrap">
          <span class="brand-mark">S</span>
          <span class="brand-name">SCHEL</span>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html">Dashboard</a>
          <a class="nav-item" href="schedules.html">Schedules</a>
          <a class="nav-item active" href="categories.html">Categories</a>
          <a class="nav-item" href="reminders.html">Reminders</a>
          <a class="nav-item" href="profile.html">Profile</a>
          <button type="button" class="nav-item nav-button" data-action="logout">Logout</button>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Organization</p>
            <h1>Categories</h1>
          </div>
          <button class="btn btn-primary" type="button">New category</button>
        </header>

        <section class="panel-card">
          <div class="panel-header">
            <h2>Category library</h2>
            <span class="badge badge-neutral">Draft</span>
          </div>

          <div class="empty-state" aria-live="polite">
            <div class="empty-icon">🏷️</div>
            <h3>No categories yet</h3>
            <p>Categories will be organized here once the backend integration is connected.</p>
            <button class="btn btn-primary" type="button">Create category</button>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/categories.js"></script>
